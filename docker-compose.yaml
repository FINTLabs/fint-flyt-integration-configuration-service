name: fint-flyt-intgr-conf-service

services:
  postgres:
    image: postgres:17-alpine
    container_name: fint-flyt-intgr-conf-service-postgres
    ports:
      - "5441:5432"
    environment:
      POSTGRES_DB: fint-flyt-intgr-conf-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/local-postgres-init.sql:/docker-entrypoint-initdb.d/10-own-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fint-flyt-intgr-conf-service"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

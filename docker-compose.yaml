name: fint-flyt-integration-configuration-service

services:
  postgres:
    image: postgres:17-alpine
    container_name: fint-flyt-integration-configuration-service-postgres
    ports:
      - "5441:5432"
    environment:
      POSTGRES_DB: fint-flyt-integration-configuration-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fint-flyt-integration-configuration-service"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

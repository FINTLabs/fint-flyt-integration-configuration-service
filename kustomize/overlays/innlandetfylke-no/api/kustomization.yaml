apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: innlandetfylke-no

resources:
  - ../../../base

labels:
  - pairs:
      app.kubernetes.io/instance: fint-flyt-intgr-conf-service_innlandetfylke_no
      fintlabs.no/org-id: innlandetfylke.no

patches:
  - patch: |-
      - op: replace
        path: "/spec/orgId"
        value: "innlandetfylke.no"

    target:
      kind: Application
      name: fint-flyt-intgr-conf-service
